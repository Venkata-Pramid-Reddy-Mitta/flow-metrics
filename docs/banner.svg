<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="flow-metrics: leading WIP signal versus lagging cycle-time average banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="55%" stop-color="#101d35"/>
      <stop offset="100%" stop-color="#132944"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)" opacity="0.45"/>
  <rect x="0" y="0" width="8" height="320" rx="4" fill="url(#accent)"/>

  <!-- Left column -->
  <text x="56" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#22d3ee" letter-spacing="2">DELIVERY FLOW &amp; SURVIVORSHIP DIAGNOSTICS</text>
  <text x="56" y="114" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#f8fafc">flow-metrics</text>
  <text x="56" y="150" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#cbd5e1">Reconstructs delivery flow from state transitions and surfaces WIP</text>
  <text x="56" y="175" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#cbd5e1">breaking its band 8 weeks before the cycle-time average moves.</text>

  <!-- Metric pills -->
  <g transform="translate(56, 206)">
    <rect x="0" y="0" width="188" height="68" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="16" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="800" fill="#22d3ee">8-Week Lead</text>
    <text x="16" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">WIP wk 13 vs CT wk 21</text>

    <rect x="204" y="0" width="196" height="68" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="220" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="800" fill="#f97316">68% Hidden</text>
    <text x="220" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">5.1d reported vs 16.1d true</text>

    <rect x="416" y="0" width="192" height="68" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="432" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="800" fill="#a78bfa">11x Gap</text>
    <text x="432" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Little's Law: 5% -&gt; 57%</text>
  </g>

  <!-- Right column: WIP vs Cycle-Time divergence chart -->
  <g transform="translate(710, 34)">
    <rect x="0" y="0" width="444" height="252" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#94a3b8">LEADING WIP SIGNAL vs LAGGING CYCLE-TIME AVERAGE</text>

    <!-- 8-week lead shaded band (wk 13 to wk 21) -->
    <rect x="210" y="48" width="128" height="156" fill="#22d3ee" opacity="0.10"/>
    <line x1="210" y1="48" x2="210" y2="204" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="338" y1="48" x2="338" y2="204" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="274" y="66" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#67e8f9">8-wk lead</text>

    <!-- Axes -->
    <line x1="32" y1="204" x2="416" y2="204" stroke="#334155" stroke-width="1.2"/>
    <line x1="32" y1="48" x2="32" y2="204" stroke="#334155" stroke-width="1.2"/>

    <!-- Baseline ceiling -->
    <line x1="32" y1="146" x2="416" y2="146" stroke="#475569" stroke-width="1" stroke-dasharray="3,4"/>
    <text x="412" y="141" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">2.5-sigma ceiling</text>

    <!-- WIP curve (rises early at wk 13) -->
    <polyline fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
      points="36,174 84,170 132,176 178,168 210,138 250,108 294,86 338,72 384,64 412,58"/>
    <circle cx="210" cy="138" r="5" fill="#22d3ee"/>

    <!-- Cycle time curve (flat until wk 21, then spikes) -->
    <polyline fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
      points="36,184 84,182 132,186 178,183 210,185 250,182 294,180 338,142 384,106 412,84"/>
    <circle cx="338" cy="142" r="5" fill="#f97316"/>

    <!-- Axis labels & legend -->
    <text x="210" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#22d3ee">Wk 13</text>
    <text x="338" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#f97316">Wk 21</text>

    <circle cx="48" cy="238" r="4" fill="#22d3ee"/>
    <text x="58" y="242" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">WIP (leading)</text>
    <circle cx="176" cy="238" r="4" fill="#f97316"/>
    <text x="186" y="242" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Completed cycle-time avg (lagging)</text>
  </g>
</svg>
