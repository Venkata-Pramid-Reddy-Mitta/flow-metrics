# Line length is 100. This is a number the project actually holds to, not a
# default left unexamined: the analytics code has a few wide table-building
# lines and 100 keeps them on one line without encouraging longer ones.
line-length = 100
target-version = "py39"

[lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = []

[lint.isort]
known-first-party = ["flowmetrics"]

[lint.per-file-ignores]
"tools/*" = ["E501"]
